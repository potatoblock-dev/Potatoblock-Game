<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="icon" href="/static/icons/favicon.ico?v=1" sizes="any">
    <link rel="stylesheet" href="/static/css/site.css?v=20260716i">
    <script>
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.get('popup') !== '1') return;
      document.documentElement.classList.add('login-popup');
    })();
    </script>
    <style>
    html.login-popup body { min-height: auto; }
    html.login-popup .login-card { box-shadow: none; }
    body { background-color: #121212 !important; color: #f5f5f5; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm bg-gray-900 rounded-xl p-8 login-card">
        <h1 class="text-2xl font-light text-center mb-6">土豆方块通行证登录</h1>
        <p class="text-sm text-gray-400 text-center mb-6">使用 OAuth2 通行证登录（含人机验证）</p>
        <button type="button" id="passportOAuthLogin" data-passport-login
                class="mb-4 w-full text-center bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded transition-colors">
            通行证 OAuth 登录
        </button>
        <script>
        (function () {
          var p = new URLSearchParams(location.search);
          var n = p.get('next') || '/';
          var btn = document.getElementById('passportOAuthLogin');
          if (btn) btn.setAttribute('data-next', n);
        })();
        </script>
    </div>
    <script src="/static/js/passport-login.js?v=5"></script>
</body>
</html>
