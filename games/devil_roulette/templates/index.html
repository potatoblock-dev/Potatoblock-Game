<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>恶魔轮盘赌 · Potatoblock</title>
  <link rel="stylesheet" href="/static/css/site.css">
  <link rel="stylesheet" href="/static/games/devil-roulette/css/devil-roulette.css">
</head>
<body>
  <main class="dr-main">
    <section id="joinScreen" class="join-screen{% if initial_room %} hidden{% endif %}">
      <div class="join-card">
        <h1>{{ game.name }}</h1>
        <p class="join-hint">输入房间号进入；不存在则自动创建。支持 2–6 人对战。</p>
        <label for="roomInput">房间号</label>
        <div class="join-room-row">
          <input id="roomInput" type="text" maxlength="32" placeholder="AB12" value="{{ initial_room }}" autocomplete="off">
          <button type="button" id="randomRoomBtn" class="btn" title="随机加入">随机</button>
        </div>
        <button type="button" id="joinBtn" class="btn primary">进入房间</button>
        <p id="joinError" class="join-error" role="alert"></p>
        <a href="/" class="join-back">← 返回游戏菜单</a>
      </div>
    </section>

    <section id="lobbyScreen" class="lobby-screen hidden">
      <div class="lobby-card">
        <h1>房间大厅</h1>
        <span id="roomCode" class="room-badge">----</span>
        <ul id="playerList"></ul>
        <p id="lobbyStatusText" class="status-text">等待玩家加入</p>
        <div class="lobby-actions">
          <button type="button" id="startBtn" class="btn primary hidden">开始游戏</button>
          <button type="button" id="copyLinkBtn" class="btn">复制链接</button>
          <button type="button" id="leaveBtn" class="btn">离开房间</button>
        </div>
      </div>
    </section>

    <section id="gameScreen" class="game-screen hidden">
      <div class="game-card">
        <div id="gameOverBanner" class="hidden" role="alert"></div>
        <h1>恶魔轮盘赌</h1>
        <p id="turnInfo" class="status-text">等待开始</p>
        <p id="chamberInfo" class="status-text"></p>
        <p id="gameStatusText" class="status-text"></p>
        <div class="game-layout">
          <aside id="hpPanel"></aside>
          <div>
            <canvas id="gunCanvas" width="288" height="384"></canvas>
            <div id="itemBar"></div>
            <div id="shootPanel"></div>
          </div>
        </div>
        <div id="detectorToast" class="hidden" role="status"></div>
      </div>
    </section>
  </main>

  <script>
    window.__DEVIL_ROULETTE_USER_ID = {{ user_id|tojson }};
    window.__DEVIL_ROULETTE_NICKNAME = {{ nickname|tojson }};
    window.__DEVIL_ROULETTE_INITIAL_ROOM = {{ initial_room|tojson }};
  </script>
  <script src="/static/games/devil-roulette/js/sprite-atlas.js"></script>
  <script src="/static/games/devil-roulette/js/gun-renderer.js"></script>
  <script src="/static/games/devil-roulette/js/devil-session.js"></script>
  <script src="/static/games/devil-roulette/js/devil-app.js"></script>
</body>
</html>
